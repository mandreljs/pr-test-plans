# Publishes the viewer and every plan to GitHub Pages on each push to main.
#
# Invalid plans don't block the deploy: one bad plan file shouldn't stop
# everyone else's new plans from going live. They're left out of the home page
# list (with a warning on the run), and opening one shows what's wrong with it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling them, so every plan commit gets published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Run tests
        run: npm test

      - name: Assemble site
        run: |
          mkdir _site
          cp index.html app.js styles.css _site/
          cp -r lib plans _site/
          node tools/plan.mjs index _site/plans _site/plans/index.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
